[project]
name = "e-network-inequality"
version = "0.1.0"
description = "Companion code for 'Inequality and the Reliability of Science' (Duijf, Noichl & Ojea Quintana): network-epistemology simulations on empirically grounded citation networks."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "dill>=0.4.1",
    "dotenv>=0.9.9",
    "joblib>=1.5.3",
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.5.1",
    "pandas>=3.0.5",
    "pyalex>=0.21",
    "scikit-learn>=1.9.0",
    "scipy>=1.18.0",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.6",
    "tqdm>=4.69.0",
    "pytest>=8.0",
    "pyarrow>=14.0",
]
